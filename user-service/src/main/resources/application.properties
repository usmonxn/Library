spring.application.name=user-service

server.port=8095

spring.datasource.url=jdbc:postgresql://localhost:5432/librarydb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt-secret=${JWT_SECRET:cnViYmVyc2hvd3dpdGhvdXRleHBlY3RxdWVzdGlvbmdvdmVybm1lbnRhbmdsZWJvd2U=}
book.service.url=${BOOK_SERVICE_URL:http://localhost:8099}
app.internal-token=${INTERNAL_SERVICE_TOKEN:realmicroservice-internal-token-change-me}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
